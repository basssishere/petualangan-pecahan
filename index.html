header{background:linear-gradient(90deg,#FF6B57,#FFA53D,#2DB56A,#6C4CF0);padding:8px 18px;border-radius:26px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);position:relative;z-index:1}

:is(.row,.col) .chip:nth-child(4n+1){background:#FFE1E6}:is(.row,.col) .chip:nth-child(4n+2){background:#DFF5E8}:is(.row,.col) .chip:nth-child(4n+3){background:#E1EEFF}:is(.row,.col) .chip:nth-child(4n){background:#FFF1C9}

.pos:nth-child(5){background:#FFB3E6}

</style></head>
<body><div id="app"></div><div id="vid" hidden></div>
<script>
const $=s=>document.querySelector(s),S={};
const A={m:1,s:1,v:1};let ctx,mt=0,step=0,nextT=0;
function ac(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state=='suspended')ctx.resume();return ctx}
function tone(f,t,d,ty='sine',v=.15,f2){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.05)}
const mf=m=>440*2**((m-69)/12),MEL=[72,76,79,76,72,76,79,84,83,79,76,79,83,79,76,72,74,77,81,77,74,77,81,86,84,79,76,79,72,0,72,0],BAS=[48,55,53,55,48,55,53,55];
function sched(){if(!A.m||!ctx)return;while(nextT<ctx.currentTime+.4){const n=MEL[step%32];if(n)tone(mf(n),nextT,.22,'triangle',.05);if(step%4==0)tone(mf(BAS[(step/4)%8]),nextT,.5,'sine',.06);nextT+=.22;step++}}
function startM(){if(!ac()||mt)return;nextT=ctx.currentTime+.05;mt=setInterval(sched,120)}
function stopM(){clearInterval(mt);mt=0}
function sfx(k){if(!A.s||!ac())return;const t=ctx.currentTime;if(k=='tap')tone(700,t,.06,'square',.05);else if(k=='ok')[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.09,.18,'triangle',.14));else if(k=='no')tone(240,t,.3,'sawtooth',.1,130);else if(k=='win')[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.11,.25,'triangle',.14));else tone(400,t,.14,'sine',.1,750)}
function tgM(){A.m=!A.m;if(A.m)startM();else stopM();render()}
function tgS(){A.s=!A.s;render()}
document.addEventListener('click',()=>{ac();if(A.m&&!mt&&!Z.open)startM()});document.addEventListener('pointerdown',e=>{if(ctx&&ctx.state=='running'&&e.target.closest('.btn,.pic,.bar i'))sfx('tap')});
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const d=document.createElement('div');d.className='cf';for(let i=0;i<18;i++){const s=document.createElement('span');s.textContent=['🎉','⭐','🍬','✨','🎈'][i%5];s.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.3}s`;d.appendChild(s)}document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
let LK,LT,LG=0,LB=0,LW=0;
function fx(){const p=$('.say p'),tx=p?p.textContent:'',G=document.querySelectorAll('.fb.g').length,B=document.querySelectorAll('.fb.b').length,W=S.k?S.k.w:0,k=[S.scr,S.st,S.qi,S.g,S.k&&S.k.r].join();
if(S.nf)S.nf=0;else if(k!=LK){if(S.scr=='result')sfx('win');else if(LK)sfx('nav')}else if(tx!=LT&&/^[✅❌🎉]/u.test(tx)){if(tx.startsWith('❌'))sfx('no');else{sfx(tx.startsWith('🎉')?'win':'ok');confetti()}}else if(G>LG){sfx('ok');confetti()}else if(W>LW||B>LB)sfx('no');
LK=k;LT=tx;LG=G;LB=B;LW=W}
function reset(){Object.assign(S,{scr:'home',st:0,ok:{learn:0,play:0,quiz:0},guess:null,seen:{},t:{},g:null,qi:0,qa:[],pd:{k:0,t:0}})}reset();
const fr=(a,b)=>`<span class=fr><b>${a}</b><b>${b}</b></span>`;
const bar=(n,k,o={})=>`<div class="bar${o.p?' p':''}${o.tap&&n>9?' tall':''}" style="grid-template-columns:${o.w||'repeat('+(o.tap&&n>9?Math.ceil(n/2):n)+',1fr)'}">${Array.from({length:n},(_,i)=>`<i class="${(o.sel?o.sel.includes(i):i<k)?'on':''}" ${o.tap?`onpointerdown="${o.tap}(${i})"`:''}></i>`).join('')}</div>`;
const cat=`<svg class=cat viewBox="0 0 100 100" aria-hidden="true"><path d="M14 100Q14 74 50 74Q86 74 86 100Z" fill="#FF6B57"/><path d="M40 74L50 86L60 74Z" fill="#fff"/><circle cx="26" cy="54" r="5" fill="#F2C29B"/><circle cx="74" cy="54" r="5" fill="#F2C29B"/><circle cx="50" cy="52" r="24" fill="#F2C29B"/><circle cx="34" cy="22" r="11" fill="#fff" stroke="#1E2A4A" stroke-width="2"/><circle cx="50" cy="16" r="13" fill="#fff" stroke="#1E2A4A" stroke-width="2"/><circle cx="66" cy="22" r="11" fill="#fff" stroke="#1E2A4A" stroke-width="2"/><rect x="30" y="24" width="40" height="12" rx="3" fill="#fff" stroke="#1E2A4A" stroke-width="2"/><rect x="32" y="26" width="36" height="8" fill="#fff"/><circle cx="41" cy="50" r="3.5" fill="#1E2A4A"/><circle cx="59" cy="50" r="3.5" fill="#1E2A4A"/><path d="M36 60Q50 56 64 60Q58 66 50 62Q42 66 36 60Z" fill="#5A3A22"/><path d="M42 68Q50 75 58 68" stroke="#1E2A4A" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
let LS='';const say=t=>{LS=t;return `<div class=say>${cat}<p>${t}</p>${t&&hasId()?`<button class="btn spk" aria-label="Dengarkan Pak Rico" data-t="${encodeURIComponent(t)}" onclick="spk(this)">🔊</button>`:''}</div>`};
const go=(s,i=0)=>{stopT();S.scr=s;S.st=i;S.t={};if(s=='play')S.g=null;render();scrollTo(0,0)};
const pick=(k,i,a)=>{S.t[k]=i;S.nf=1;render();if(a!==undefined){const f=document.querySelector('.fb[data-k="'+k+'"]');if(f)vsay(f.textContent);if(i==a){sfx('ok');confetti()}else sfx('no')}};
function opts(k,l,a,h){const c=S.t[k];return `<div class=row>${l.map((t,i)=>`<button class="btn chip ${c==i?(i==a?'good':'bad'):''}" onclick="pick('${k}',${i},${a})">${t}</button>`).join('')}</div>`+(c==null?'':`<p class="fb ${c==a?'g':'b'}" data-k="${k}">${c==a?'✅ Benar! '+h[1]:'❌ Belum tepat. '+h[0]}</p>`)}
const TT=['Tahap 0: Ingat-ingat pecahan','Tahap 1: Mengalami masalah','Tahap 2: Menemukan sendiri','Tahap 3: Gambar dan simbol','Tahap 4: Menerapkan pada pita','Tahap 5: Merefleksi','Kartu Kesimpulan'];
const TN=['Aktivasi konsep dasar sekaligus diagnostik. Amati siswa yang salah pada soal 2: mereka belum memahami syarat bagian sama besar.','Biarkan siswa menebak tanpa dikoreksi. Tanyakan alasan tebakan mereka secara lisan.','Tanya: apa yang sama, apa yang berubah? Minta siswa menyebut jawabannya sebelum membaca layar.','Hubungkan gambar dengan simbol. Bahas miskonsepsi "tambah angka yang sama" dengan gambar.','Ini tahap transfer: konsep yang sama pada bentuk pita. Minta siswa menjelaskan langkahnya.','Refleksi: bandingkan tebakan awal dan akhir. Ajak siswa menjelaskan dengan kata sendiri.','Siswa menyusun definisinya sendiri. Kartu dapat dibuka lagi dari peta.'];
const KART=`<div class=kartu><h3>Kartu Kesimpulan</h3><p class=big>${fr(1,2)} = ${fr(2,4)} = ${fr(3,6)}</p><p>Pecahan adalah bagian dari benda utuh yang dibagi sama besar. Pecahan senilai memiliki nilai yang sama walaupun pembilang dan penyebutnya berbeda. Cara mencarinya: kalikan atau bagi pembilang dan penyebut dengan bilangan yang sama.</p></div>`;
const L=[
()=>say('Halo, aku Pak Rico! Ayo ingat lagi: satu martabak dibagi 4 bagian sama besar, lalu diambil 3 bagian.')+bar(4,3)+`<p class=big>${fr(3,4)} <span>pembilang 3 = bagian yang diambil<br>penyebut 4 = seluruh bagian yang sama besar</span></p><h3>Coba dulu ya</h3><p>1. Pecahan apa yang ditunjukkan gambar ini?</p>${bar(6,2)}`+opts('a',['2/6','2/4','4/6'],0,['Hitung dulu bagian seluruhnya, lalu bagian yang diarsir.','2 bagian diarsir dari 6 bagian seluruhnya.'])+`<p>2. Apakah gambar ini menunjukkan 1/3?</p>${bar(3,1,{w:'3fr 1fr 1fr'})}`+opts('b',['Ya','Tidak'],1,['Lihat ukuran tiap bagian.','Bagiannya tidak sama besar, jadi bukan 1/3.']),
()=>say('Pelanggan memesan 1/2 loyang martabak. Tapi loyang sudah terpotong jadi 4 bagian. Berapa potong yang harus diambil? Tebak dulu!')+bar(4,0)+`<div class=row>${[1,2,3].map(n=>`<button class="btn chip ${S.guess==n?'sel':''}" onclick="S.guess=${n};render()">${n} potong</button>`).join('')}</div>`+(S.guess?'<p class="fb g">Tebakanmu dicatat. Kita buktikan di tahap berikutnya!</p>':''),

function ptime(){const P=S.pq;if(P.d)return;none(P.st);pend('⏰ Waktu habis! '+pexp(),'no',null)}
function pf(t){const P=S.pq,[a,b,n]=OR[P.r];if(P.d||P.lock[t])return;if(P.sel[t].length==a*n/b){const g=hit(P.st,t,MT.t/MT.max,MT.max-MT.t);pend(`🎉 Tim ${t} tercepat dan tepat! +${g.p} poin`+(g.cb?` 🔥 bonus beruntun +${g.cb}`:'')+'. '+pexp(),'ok',t);confetti()}else{miss(P.st,t,2);P.w[t]++;P.lock[t]=1;P.wn=null;P.m=`❌ Tim ${t} belum tepat, −2 poin. Terkunci 3 detik.`;S.nf=1;render();sfx('no');setTimeout(()=>{P.lock[t]=0;render()},3000)}}
function pn(){const P=S.pq;if(!P||S.g!='o')return;clearTimeout(MT.to);if(P.r==OR.length-1){P.over=1;stopT();S.nf=1;render();sfx('win');confetti();return}P.r++;P.sel={A:[],B:[]};P.lock={A:0,B:0};P.w={A:0,B:0};P.d=0;P.m='';P.wn=null;S.nf=1;render();sfx('nav');startTm(45,ptime)}
function order(){const P=S.pq;if(P.over)return board(P.st,`<button class=btn onclick="startO()">Main lagi</button><button class="btn alt" onclick="exitG()">Kembali ke menu</button>`);
const[a,b,n]=OR[P.r],panel=(t,c)=>`<div class="team ${c}"><h3>Tim ${t}</h3><div class=score>${P.st[t].pt}${strk(P.st[t])}</div>${bar(n,0,{sel:P.sel[t],tap:t=='A'?'pa':'pb'})}<button class=btn ${P.lock[t]||P.d?'disabled':''} onpointerdown="pf('${t}')">${P.lock[t]?'Terkunci 3 detik...':P.d?'Ronde selesai':'Selesai!'}</button>${P.w[t]&&!P.d?`<p>Petunjuk: pesanannya seperti gambar ini</p>${bar(b,a)}`:''}</div>`;
return `<h2>Pesanan Kilat Warung Pak Rico</h2><p>Pesanan ${P.r+1} dari ${OR.length}. Arsir loyang sampai senilai pesanan lalu tekan Selesai! Tercepat dan tepat: 10 poin + bonus kecepatan. Salah: −2 poin dan terkunci 3 detik.</p><div class=arena>${panel('A','tA')}<div class=mid>${tmr()}<p class=big>Pak Rico butuh ${fr(a,b)} loyang martabak!</p><p>Loyang terpotong ${n} bagian.</p>${P.m?`<p class="fb ${P.wn?'g':'b'}">${P.m}</p>`:''}${P.d?`<button class=btn onclick="pn()">Lanjut ▶</button>`:''}</div>${panel('B','tB')}</div>${BTN}`}
function play(){if(S.g=='k')return knife();if(S.g=='t')return twin();if(S.g=='v')return versus();if(S.g=='r')return race();if(S.g=='o')return order();return say('Pilih permainan yang kamu suka!')+`<div class=two><button class="btn card2" onclick="startK()">🔪 Pisau Ajaib ${S.pd.k?'✅':''}</button><button class="btn card2" onclick="startT()">🃏 Kembar Pecahan ${S.pd.t?'✅':''}</button></div><button class="btn card2" style="width:100%" onclick="startV()">⚔️ Adu Cepat: Tim A lawan Tim B</button><button class="btn card2" style="width:100%" onclick="startR()">🚗 Balap Kue ke Toko</button><button class="btn card2" style="width:100%" onclick="startO()">🥞 Pesanan Kilat Warung Pak Rico</button><p>Game kelompok dimainkan bersama di depan layar untuk seru-seruan bersama teman.</p>`+`<button class=btn onclick="startQ()">Lanjut ke Uji Kemampuan</button>`}
const Q=[
{p:'Pecahan mana yang senilai dengan 2/3?',v:bar(3,2),o:['4/6','3/5','2/6'],a:0,s:'u',e:'2/3 = 4/6, karena pembilang dan penyebut sama-sama dikali 2.'},
{p:'Gambar ini menunjukkan 6/8. Pecahan mana yang senilai?',v:bar(8,6),o:['3/4','6/10','2/3'],a:0,s:'u',e:'6/8 = 3/4, karena pembilang dan penyebut sama-sama dibagi 2.'},
{p:'Pak Rico memotong kue jadi 12 bagian dan mengambil 9 bagian. Apa pecahan paling sederhananya?',o:['3/4','1/4','9/10'],a:0,s:'a',e:'9 ÷ 3 = 3 dan 12 ÷ 3 = 4, jadi 3/4.'},
{p:'Pita 2/5 bagian akan dibagi jadi 10 bagian sama panjang. Berapa bagian yang diambil?',v:bar(5,2,{p:1}),o:['4','5','7'],a:0,s:'a',e:'2/5 = 4/10, karena dikali 2.'},
{p:'Dodi berkata 3/5 = 6/8. Bagaimana pendapatmu?',o:['Tidak setuju: 3/5 = 6/10, karena pembilang dan penyebut sama-sama dikali 2','Setuju: pembilangnya dikali 2','Setuju: selisih 5−3 dan 8−6 sama'],a:0,s:'n',e:'Kedua angka harus dikali bilangan yang sama. Dodi hanya mengubah penyebut dengan cara berbeda.'}];
function startQ(){S.qi=0;S.qa=[];go('quiz')}
function qp(i){if(S.qa[S.qi]==null){S.qa[S.qi]=i;S.nf=1;render();const f=document.querySelector('.fb');if(f)vsay(f.textContent);if(i==Q[S.qi].a){sfx('ok');confetti()}else sfx('no')}}
function qn(){if(S.qi==4){S.ok.quiz=1;go('result')}else{S.qi++;render()}}
function quiz(){const q=Q[S.qi],a=S.qa[S.qi];return `<p>Soal ${S.qi+1} dari 5</p>`+say(q.p)+(q.v||'')+`<div class=col>${q.o.map((t,i)=>`<button class="btn chip ${a==null?'':i==q.a?'good':a==i?'bad':''}" onclick="qp(${i})">${t}</button>`).join('')}</div>`+(a==null?'':`<p class="fb ${a==q.a?'g':'b'}">${a==q.a?'✅ Benar! ':'❌ Belum tepat. '}${q.e}</p><button class=btn onclick="qn()">${S.qi==4?'Lihat hasil':'Lanjut'}</button>`)}
function result(){if(!S.ok.quiz)return say('Kamu belum mengerjakan Uji Kemampuan, jadi hasilnya belum ada.')+'<button class=btn onclick="startQ()">Kerjakan Uji Kemampuan</button>';const sc={u:0,a:0,n:0};Q.forEach((q,i)=>{if(S.qa[i]==q.a)sc[q.s]++});const tot=sc.u+sc.a+sc.n,st=tot>=5?3:tot>=3?2:1;return say(tot>=4?'Hebat! Kamu jago pecahan senilai!':'Kamu sudah berusaha. Yuk ulangi bagian yang masih sulit!')+`<p class=stars>${'⭐'.repeat(st)}</p><p class=big>Skor ${tot} dari 5</p>`+[['u','Memahami',2,2],['a','Mengaplikasi',2,4],['n','Bernalar',1,5]].map(([k,l,mx,ts])=>`<div class=meter><span>${l}: ${sc[k]} dari ${mx}</span><div class=mbar><i style="width:${sc[k]/mx*100}%"></i></div>${sc[k]<mx?`<button class="btn alt" onclick="go('learn',${ts})">Ulangi Tahap ${ts}</button>`:''}</div>`).join('')+`<button class=btn onclick="startQ()">Coba lagi</button>`}
function card(){return say('Ini kartu kesimpulanmu. Simpan di ingatanmu ya!')+KART}
function home(){const P=[['learn','📖','Belajar',1,"go('learn')"],['video','🎬','Video Penjelasan',1,"go('video')"],['play','🎮','Main',1,"go('play')"],['quiz','📝','Uji Kemampuan',1,"startQ()"],['result','⭐','Hasil',1,"go('result')"]];return say('Selamat datang di warung Pak Rico! Pilih menu mana saja yang kamu mau!')+`<div class=map>${P.map(p=>`<button class="btn pos" ${p[3]?'':'disabled'} onclick="${p[4]}">${p[1]} ${p[2]} ${S.ok[p[0]]?'✅':p[3]?'':'🔒'}</button>`).join('')}</div>`+(S.ok.learn?`<button class="btn alt" onclick="go('card')">Lihat Kartu Kesimpulan</button>`:'')}
const B=h=>`<div class=vbig>${h}</div>`,SM=h=>`<p class=vsm>${h}</p>`;
const VID={1:{t:'Kenapa 1/2 sama dengan 2/4?',sc:[
{d:5,t:'Halo! Di warung Pak Rico ada satu loyang martabak yang besar.',f:p=>B('🥞 Satu loyang martabak')+bar(1,0)},
{d:6,t:'Loyang dibelah jadi 2 bagian sama besar. Satu bagian diambil. Itu 1/2.',f:p=>B('Dibelah jadi 2 bagian sama besar')+bar(p<.3?1:2,p<.6?0:1)+(p>.6?B(fr(1,2)):'')},
{d:7,t:'Sekarang setiap potongan dibelah lagi jadi dua. Loyang menjadi 4 potong.',f:p=>B('Setiap potongan dibelah lagi '+(p>.3&&p<.65?'✂️':''))+bar(p<.5?2:4,p<.5?1:2)+B(p<.5?fr(1,2):fr(2,4))},
{d:7,t:'Potongan jadi lebih banyak, tetapi luas yang diarsir tetap sama. Sekarang 2 dari 4 potong.',f:p=>bar(2,1)+bar(4,2)+(p>.4?B(fr(1,2)+' = '+fr(2,4)):'')+SM('Luas arsirannya sama!')},
{d:6,t:'Jadi 1/2 dan 2/4 bernilai sama. Itulah pecahan senilai!',f:p=>B('⭐ '+fr(1,2)+' = '+fr(2,4)+' ⭐')+B('Pecahan senilai!')+bar(2,1)+bar(4,2)}]},
2:{t:'Cara mencari pecahan senilai',sc:[
{d:5,t:'Bagaimana mencari pecahan senilai 2/3? Kita kalikan pembilang dan penyebut dengan bilangan yang sama.',f:p=>B('Mencari pecahan senilai '+fr(2,3))+bar(3,2)},
{d:7,t:'Kalikan dengan 2. Pembilang 2 kali 2 sama dengan 4. Penyebut 3 kali 2 sama dengan 6.',f:p=>B(fr(2,3)+' × '+fr(2,2)+(p>.5?' = '+fr(4,6):''))+(p>.3?bar(6,4):bar(3,2))+(p>.5?SM('2 × 2 = 4 dan 3 × 2 = 6'):'')},
{d:6,t:'Lihat gambarnya! Luas yang diarsir sama, hanya potongannya lebih banyak.',f:p=>bar(3,2)+bar(6,4)+B(fr(2,3)+' = '+fr(4,6))+SM('Sama luas!')},
{d:7,t:'Bisa juga dibagi. 6/8 dibagi 2 menjadi 3/4.',f:p=>B(fr(6,8)+' ÷ '+fr(2,2)+(p>.5?' = '+fr(3,4):''))+bar(8,6)+(p>.5?bar(4,3):'')},
{d:7,t:'Ingat! Kalikan atau bagi dengan bilangan yang sama. Jangan ditambah.',f:p=>B('⚠️ Jangan ditambah!')+B(fr(1,2)+' ≠ '+fr(3,4))+bar(2,1)+bar(4,3)+SM('Luasnya berbeda')}]}};
let Z={open:0,on:0,t:0,si:-1,end:0,sp:0,iv:0,last:0,id:1};
const hasId=()=>{try{return 'speechSynthesis' in window&&speechSynthesis.getVoices().some(v=>/^id/i.test(v.lang))}catch(e){return false}};
try{speechSynthesis.getVoices()}catch(e){}
const vEnds=()=>{let a=0;return VID[Z.id].sc.map(c=>a+=c.d)};
function speak(t){Z.speaking=0;if(!Z.sp||!Z.on)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.9;const v=speechSynthesis.getVoices().find(v=>/^id/i.test(v.lang));if(v)u.voice=v;Z.u=u;Z.speaking=1;Z.spStart=performance.now();Z.spMax=(t.length*.13+3)*1000;u.onend=u.onerror=()=>{if(Z.u===u)Z.speaking=0};speechSynthesis.speak(u)}catch(e){Z.speaking=0}}
function vOpen(id){Z.id=id;Z.open=1;try{speechSynthesis.cancel()}catch(e){}Z.sp=hasId();stopM();const d=$('#vid');d.hidden=false;d.innerHTML=`<div class=vbox><div class=vtop><b>🎬 ${VID[id].t}</b><button class="btn alt" onclick="vClose()">✖ Tutup</button></div><div id=vst class=vstage></div><div id=vsub>${say('')}</div><div class=vpg><i id=vpg></i></div><div class=row><button id=vpp class=btn onclick="vTog()">⏸ Jeda</button><button class="btn alt" onclick="vRe()">🔁 Ulangi</button>${Z.sp?`<button id=vsp class="btn alt" onclick="vSp()">🗣️ Narasi: nyala</button>`:''}</div></div>`;vRe()}
function vRe(){Z.t=0;Z.si=-1;Z.end=0;Z.on=1;$('#vpp').textContent='⏸ Jeda';clearInterval(Z.iv);Z.last=performance.now();Z.iv=setInterval(()=>{const n=performance.now();if(Z.on){let nt=Z.t+(n-Z.last)/1000;if(Z.speaking&&n-Z.spStart>Z.spMax)Z.speaking=0;if(Z.sp&&Z.speaking&&Z.si>=0){const e=vEnds()[Z.si];if(nt>=e)nt=e-.001}Z.t=nt}else Z.spStart+=n-Z.last;Z.last=n;vTick()},60);vTick()}
function vTick(){const sc=VID[Z.id].sc,tot=sc.reduce((a,c)=>a+c.d,0);let t=Math.min(Z.t,tot),i=0;while(i<sc.length-1&&t>=sc[i].d){t-=sc[i].d;i++}const c=sc[i],p=Math.min(1,t/c.d);$('#vst').innerHTML=c.f(p);const n=Math.ceil(c.t.length*Math.min(1,p*2.2));$('#vsub p').textContent=c.t.slice(0,n);$('#vpg').style.width=(Math.min(Z.t,tot)/tot*100)+'%';
if(i!=Z.si){Z.si=i;if(Z.on)sfx('nav');speak(c.t)}
if(Z.t>=tot&&!Z.end){Z.end=1;Z.on=0;$('#vpp').textContent='🔁 Putar lagi';sfx('win')}}
function vTog(){if(Z.end){vRe();return}Z.on=!Z.on;$('#vpp').textContent=Z.on?'⏸ Jeda':'▶ Lanjut';try{Z.on?speechSynthesis.resume():speechSynthesis.pause()}catch(e){}}
function vSp(){Z.sp=!Z.sp;$('#vsp').textContent='🗣️ Narasi: '+(Z.sp?'nyala':'mati');if(!Z.sp){try{speechSynthesis.cancel()}catch(e){}Z.speaking=0}else if(Z.si>=0&&!Z.end)speak(VID[Z.id].sc[Z.si].t)}
function vClose(){clearInterval(Z.iv);Z.open=0;Z.on=0;try{speechSynthesis.cancel()}catch(e){}$('#vid').hidden=true;$('#vid').innerHTML='';if(A.m)startM()}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&Z.open)vClose()});
const cl=t=>t.replace(/<[^>]*>/g,' ').replace(/(\d+)\/(\d+)/g,'$1 per $2').replace(/×/g,' dikali ').replace(/÷/g,' dibagi ').replace(/≠/g,' tidak sama dengan ').replace(/=/g,' sama dengan ').replace(/−/g,' kurang ').replace(/\.\.\./g,' titik titik ').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u2B50\uFE0F\u200b]/gu,'').replace(/:/g,',').replace(/\s+/g,' ').trim();
function vsay(t){if(!A.v||Z.open||!t)return;try{const x=cl(t);if(!x)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang='id-ID';u.rate=.9;u.pitch=.85;const vs=speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang)),v=vs.find(v=>/andika|male|pria|rizki|dimas/i.test(v.name))||vs[0];if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function spk(el){const w=A.v;A.v=1;vsay(decodeURIComponent(el.dataset.t));A.v=w}
function tgV(){A.v=!A.v;if(!A.v)try{speechSynthesis.cancel()}catch(e){}render()}
let LKA='';
function auto(){const k=S.scr=='learn'?'l'+S.st:S.scr=='quiz'?'q'+S.qi:'';if(k==LKA)return;LKA=k;if(!k||Z.open||!A.v)return;vsay(k[0]=='l'?TT[S.st]+'. '+LS:LS)}
try{speechSynthesis.onvoiceschanged=()=>{if(!Z.open)render()}}catch(e){}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsOK=()=>!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const fsOn=()=>!!fsEl();
function tgF(){const d=document,e=d.documentElement;try{if(fsEl())(d.exitFullscreen||d.webkitExitFullscreen).call(d);else(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(x){}}
['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,()=>render()));
function video(){return say('Mau nonton video penjelasan? Pilih ya!')+`<div class=two><button class="btn card2" onclick="vOpen(1)">🎬 Kenapa 1/2 = 2/4?</button><button class="btn card2" onclick="vOpen(2)">🎬 Cara mencari pecahan senilai</button></div>`}
const V={home,learn,play,quiz,result,card,video};

render();
